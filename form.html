<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Product Review Form">

<meta name="author" content="Alfredo Cassanje">

<title>Product Review Form</title>

<link rel="stylesheet" href="styles/form.css">

<script src="scripts/form.js" defer></script>

</head>


<body>


<header>

<h1>Product Review</h1>

</header>



<main>


<form method="get" action="review.html">


<fieldset>


<legend>Product Information</legend>



<label for="product">
Product Name <span class="required">*</span>
</label>


<select id="product" name="product" required>

<option value="" disabled selected>
Select a product...
</option>

</select>




<label>
Overall Rating <span class="required">*</span>
</label>


<div class="rating">


<label for="rating1">
<input 
type="radio"
id="rating1"
name="rating"
value="1"
required>
☆
</label>



<label for="rating2">

<input 
type="radio"
id="rating2"
name="rating"
value="2">

☆☆

</label>



<label for="rating3">

<input 
type="radio"
id="rating3"
name="rating"
value="3">

☆☆☆

</label>



<label for="rating4">

<input 
type="radio"
id="rating4"
name="rating"
value="4">

☆☆☆☆

</label>



<label for="rating5">

<input 
type="radio"
id="rating5"
name="rating"
value="5">

☆☆☆☆☆

</label>


</div>


<label for="date">

Date Installed <span class="required">*</span>

</label>

<input 
type="date"
id="date"
name="date"
required>

<label>

Useful Features

</label>

<label>

<input
type="checkbox"
id="feature1"
name="features"
value="Durability">

Durability

</label>



<label>

<input
type="checkbox"
id="feature2"
name="features"
value="Performance">

Performance

</label>



<label>

<input
type="checkbox"
id="feature3"
name="features"
value="Design">

Design

</label>



<label>

<input
type="checkbox"
id="feature4"
name="features"
value="Easy Use">

Easy Use

</label>





<label for="review">

Written Review

</label>

<textarea
id="review"
name="review">

</textarea>

<label for="username">

User Name

</label>


<input
type="text"
id="username"
name="username">

<input
type="submit"
value="Submit Review">

</fieldset>

</form>

</main>

<footer>

<p>
© 2026 Alfredo Cassanje | WDD131
</p>

</footer>

</body>

</html>
